<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f0f2f5; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header a { color: #4CAF50; text-decoration: none; }
        .header a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f2f2f2; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-view { background: #4CAF50; color: #fff; }
        .btn-view:hover { background: #388E3C; }
        .btn-del { background: #f44336; color: #fff; }
        .btn-del:hover { background: #d32f2f; }
        .btn-back { display: inline-block; margin-bottom: 15px; color: #4CAF50; text-decoration: none; }
        .workout-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; }
        .workout-item:last-child { border-bottom: none; }
        .workout-item .info { flex: 1; }
        .workout-item .title { font-weight: bold; }
        .workout-item .date { font-size: 14px; color: #666; }
        .msg { margin-top: 15px; font-weight: bold; }
        .msg.error { color: #d32f2f; }
        .msg.success { color: #2e7d32; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .role-badge.admin { background: #ff9800; color: #fff; }
        .role-badge.user { background: #9E9E9E; color: #fff; }
        .user-row { cursor: pointer; }
        .user-row:hover { background: #f5f5f5; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👑 Админ</h1>
        <a href="/dashboard.html">← Назад</a>
    </div>

    <div id="usersSection">
        <div id="usersList">⏳ Загрузка...</div>
    </div>

    <div id="workoutsSection" style="display:none; margin-top:20px; border-top:1px solid #ddd; padding-top:20px;">
        <a href="#" id="backToUsers" class="btn-back">← Назад</a>
        <h3 id="userWorkoutsTitle"></h3>
        <div id="userStatsBlock" style="display: none; max-width: 200px; margin: 15px auto;">
            <canvas id="userStatsChart"></canvas>
        </div>
        <div id="userWorkoutsList"></div>
        <div id="adminMsg" class="msg"></div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
